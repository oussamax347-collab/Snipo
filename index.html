<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snipo</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#050B1F;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
max-width:900px;
width:100%;
text-align:center;
}

.logo{
font-size:70px;
font-weight:bold;
margin-bottom:15px;
}

.logo span{
color:#4F8CFF;
}

.subtitle{
font-size:24px;
color:#cbd5e1;
margin-bottom:40px;
}

.search-box{
background:white;
padding:15px;
border-radius:20px;
display:flex;
flex-direction:column;
gap:12px;
}

input{
padding:18px;
border:none;
border-radius:12px;
font-size:18px;
outline:none;
}

button{
padding:18px;
border:none;
border-radius:12px;
background:#4F8CFF;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#3b7cff;
}

.categories{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-top:25px;
}

.category{
background:rgba(255,255,255,0.08);
padding:10px 18px;
border-radius:999px;
}

.examples{
margin-top:60px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:rgba(255,255,255,0.06);
padding:20px;
border-radius:18px;
text-align:left;
}

.card h3{
margin-bottom:10px;
}

.card p{
color:#cbd5e1;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
Sni<span>po</span>
</div>

<div class="subtitle">
Stop comparing. Start deciding.
</div>

<div class="search-box">

<input
type="text"
placeholder="Example: 4-day trip to Barcelona under €600">

<input
type="number"
placeholder="Budget">

<button>
Find My Best Options
</button>

</div>

<div class="categories">
<div class="category">✈️ Travel</div>
<div class="category">🏨 Hotels</div>
<div class="category">💻 Products</div>
<div class="category">🍽️ Restaurants</div>
<div class="category">🎓 Courses</div>
</div>

<div class="examples">

<div class="card">
<h3>Weekend Trip</h3>
<p>Barcelona under €500</p>
</div>

<div class="card">
<h3>Best Laptop</h3>
<p>Programming under $1200</p>
</div>

<div class="card">
<h3>Hotel</h3>
<p>Marrakech for couples</p>
</div>

<div class="card">
<h3>Learning</h3>
<p>Best AI course for beginners</p>
</div>

</div>

</div>

</body>
</html>
